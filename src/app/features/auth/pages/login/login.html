<div class="container-fluid d-flex flex-column justify-content-center align-items-center">

  <div class="title mt-3 mb-5">
    <h1 class="store-name">BOOK STORE</h1>
  </div>

  <div class="content">
    <form class="login-form">

      
      <label class="input-label">
        Email hoặc số điện thoại
      </label>

      <input
        class="input-field"
        type="text"
      >

      
      <label class="input-label mt-2">
        Mật khẩu
      </label>

      <div class="password-wrapper">
        <input
          class="input-field"
          [type]="showPassword ? 'text' : 'password'"
          placeholder="Tối thiểu 8 ký tự"
        >

        <i
          class="fa-solid"
          [class.fa-eye]="!showPassword"
          [class.fa-eye-slash]="showPassword"
          (click)="togglePassword()"
        ></i>
      </div>

      
      <div class="login-options mt-1 mb-1 d-flex justify-content-between">

        <label class="remember-login">
          <input
            class="form-check-input remember-checkbox"
            type="checkbox"
          >

          <span class="remember-label">
            Nhớ đăng nhập
          </span>
        </label>

        <button
          type="button"
          class="forgot-password"
        >
          Quên mật khẩu?
        </button>

      </div>

      
      <button
        type="button"
        class="login-button mt-4 mb-1"
      >
        Đăng nhập
      </button>

     
      <div class="divider-container d-flex align-items-center">
        <hr class="divider">
        <span class="divider-text">hoặc</span>
        <hr class="divider">
      </div>

      
      <button
        type="button"
        class="google-login-button mt-1 mb-1"
      >
        <i class="fa-brands fa-google"></i>
        Đăng nhập với Google
      </button>

   
      <button
        type="button"
        class="facebook-login-button mt-1 mb-1"
      >
        <i class="fa-brands fa-facebook-f"></i>
        Đăng nhập với Facebook
      </button>

    </form>
  </div>

 
  <p class="register-text">
    Chưa có tài khoản?

    <button
      type="button"
      class="register-button"
      (click)="goToRegister()"
    >
      Đăng ký ngay?
    </button>
  </p>

</div>
