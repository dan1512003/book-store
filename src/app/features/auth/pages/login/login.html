<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <div class="container-fluid d-flex flex-column justify-content-center align-items-center">

    <div class="title mt-3 mb-5">
      <h1 class="store-name">BOOK STORE</h1>
    </div>

    <div class="content">
      <form class="login-form" action="">

        <label class="input-label">Email hoặc số điện thoại</label>
        <input class="input-field">

        <label class="input-label">Mật khẩu</label>
        <input class="input-field">

        <div class="login-options mt-1 mb-1 d-flex flex-row justify-content-between">

          <div class="remember-login ">
            <input
              class="form-check-input remember-checkbox"
              type="checkbox"
            >

            <label class="form-check-label remember-label">
              Nhớ đăng nhập
            </label>
          </div>

          <button class="forgot-password">
            Quên mật khẩu?
          </button>

        </div>

        <button class="login-button mt-4 mb-1">
          Đăng nhập
        </button>
<div class="divider-container d-flex flex-row align-items-center">
  <hr class="divider">
  <p class="divider-text">hoặc</p>
  <hr class="divider">
</div>
        <button class="google-login-button mt-1 mb-1">
          Đăng nhập với Google
        </button>

        <button class="facebook-login-button mt-1  mb-1">
          Đăng nhập với Facebook
        </button>

      </form>
    </div>

    <p class="register-text">
      Chưa có tài khoản
      <button class="register-button">
        Đăng ký ngay?
      </button>
    </p>

  </div>
</body>
</html>
